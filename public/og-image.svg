<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Content Container -->
  <g transform="translate(100, 120)">
    <!-- Status Badge -->
    <rect width="440" height="42" rx="21" fill="#064e3b" stroke="#059669" stroke-width="2" />
    <circle cx="24" cy="21" r="6" fill="#34d399" />
    <text x="42" y="27" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="1">DISPONÍVEL PARA ESTÁGIO / INTERNSHIP</text>

    <!-- Name / Title -->
    <text x="0" y="140" fill="#ffffff" font-family="monospace" font-size="68" font-weight="900" letter-spacing="-1">Gabriel Campos</text>
    
    <!-- Subtitle -->
    <text x="0" y="205" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="600">Portfólio &amp; Diário de Engenharia Transparente</text>
    <text x="0" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22">Estudante de Análise e Desenvolvimento de Sistemas (ADS)</text>
    <text x="0" y="295" fill="#cbd5e1" font-family="monospace" font-size="18">Python/Django • TypeScript/Node.js • Modelagem Relacional • Fundamentos em C</text>

    <!-- Bottom Tech Pill Highlights -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="22" y="22" fill="#e2e8f0" font-family="monospace" font-size="14">CineTrack</text>

      <rect x="145" y="0" width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="165" y="22" fill="#e2e8f0" font-family="monospace" font-size="14">TypeScript API</text>

      <rect x="320" y="0" width="190" height="34" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="338" y="22" fill="#e2e8f0" font-family="monospace" font-size="14">Reserva de Rádio</text>

      <rect x="525" y="0" width="150" height="34" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="545" y="22" fill="#e2e8f0" font-family="monospace" font-size="14">Estudos em C</text>
    </g>
  </g>
</svg>
